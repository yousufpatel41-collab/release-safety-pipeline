groups:
  - name: runbook-service
    rules:
      - alert: RunbookServiceDown
        expr: up{job="runbook-assistant"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Runbook service is not responding"
      - alert: RunbookHigh5xxRate
        expr: sum(rate(runbook_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(runbook_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx rate above 5 percent"
