name: formatting-preview
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'feature/duplicates-and-llm-answer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/duplicates-and-llm-answer
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.3
      - name: Create preview of formatted source
        run: |
          ruff check --fix .
          ruff format .
          python - <<'PY'
          import base64, json, subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for path in paths:
              print('FORMATTED_FILE_JSON='+json.dumps({'path':path,'content_b64':base64.b64encode(Path(path).read_bytes()).decode()}))
          PY
