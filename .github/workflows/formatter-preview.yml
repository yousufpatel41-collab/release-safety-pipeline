name: formatting-preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.3
      - name: Preview formatted files for project maintenance
        run: |
          ruff format .
          python - <<'PY'
          import base64, json, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in paths:
              with open(path, 'rb') as f:
                  content = base64.b64encode(f.read()).decode()
              print('FORMATTED_FILE_JSON=' + json.dumps({'path': path, 'content_b64': content}))
          PY
